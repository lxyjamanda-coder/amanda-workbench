<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Amanda工作台">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBE3EA">
<title>Amanda 小红书工作台</title>
<style>
:root{
  --bg1:#FBE0E7; --bg2:#FDEFEF; --bg3:#FAF6F3;
  --ink:#4A3A3F; --ink2:#8B757C; --muted:#B09AA1;
  --card:#FFFFFF; --chip:#FCE9EE; --chipTxt:#7D5B66;
  --accent:#EE9DB1; --accent2:#E47E99; --accentDeep:#C4627E;
  --line:#F5E4E8; --sage:#8FA383; --sageBg:#EDF2E8;
  --shadow:0 8px 22px rgba(190,140,155,.10);
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  color:var(--ink);
  background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 34%,var(--bg3) 72%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
#app{display:flex;min-height:100dvh}

.rail{
  position:fixed;left:0;top:0;bottom:0;width:86px;z-index:30;
  background:rgba(255,251,250,.72);
  backdrop-filter:saturate(140%) blur(14px);-webkit-backdrop-filter:saturate(140%) blur(14px);
  border-right:1px solid rgba(255,255,255,.7);
  padding:calc(14px + env(safe-area-inset-top)) 6px calc(14px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:2px;overflow-y:auto;
}
.brand{display:flex;flex-direction:column;align-items:center;gap:5px;padding:2px 0 14px}
.brandMark{width:36px;height:36px;border-radius:50%;background:linear-gradient(145deg,#EFB3C3,#D9748F);
  color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 10px rgba(214,120,145,.25)}
.brandTxt{font-size:9.5px;color:var(--muted);letter-spacing:.08em}
.navItem{
  appearance:none;border:0;background:transparent;cursor:pointer;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:9px 2px 8px;border-radius:14px;transition:.18s;width:100%;
}
.navItem .ico{width:38px;height:38px;border-radius:12px;background:#FFF6F4;
  display:flex;align-items:center;justify-content:center;transition:.18s;
  box-shadow:inset 0 0 0 1px rgba(238,205,212,.5)}
.navItem .ico svg{width:19px;height:19px;stroke:#B18B97;stroke-width:1.7;fill:none;transition:.18s}
.navItem .lbl{font-size:10.5px;color:#9A8189;letter-spacing:.03em;line-height:1.2;text-align:center}
.navItem.active{background:rgba(255,255,255,.9);box-shadow:0 4px 12px rgba(200,155,168,.16)}
.navItem.active .ico{background:linear-gradient(145deg,#F2B6C6,#DF8299);box-shadow:0 4px 10px rgba(214,120,145,.22)}
.navItem.active .ico svg{stroke:#fff}
.navItem.active .lbl{color:#7E4D5D;font-weight:600}

.sheet{margin-left:86px;flex:1;padding:calc(12px + env(safe-area-inset-top)) 12px calc(48px + env(safe-area-inset-bottom));max-width:560px}
.topBar{display:flex;align-items:center;gap:10px;padding:2px 4px 14px}
.accSwitch{display:flex;gap:7px;padding:0 4px 13px}
.accBtn{appearance:none;border:0;font-family:inherit;cursor:pointer;flex:1;padding:9px 8px;border-radius:13px;
  background:rgba(255,255,255,.68);color:#93787F;font-size:11.5px;letter-spacing:.02em;line-height:1.35;transition:.18s;
  box-shadow:inset 0 0 0 1px rgba(238,205,212,.7)}
.accBtn b{display:block;font-size:12px;font-weight:600}
.accBtn small{display:block;font-size:9px;opacity:.75;margin-top:2px;font-weight:400}
.accBtn.on{background:linear-gradient(135deg,#F3AFC2,#E5839B);color:#fff;box-shadow:0 5px 13px rgba(220,130,150,.24)}
.accBtn.on small{opacity:.9}
.topMark{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 8px rgba(190,150,160,.14);font-size:14px;color:var(--accentDeep)}
.topTitle{font-size:13px;letter-spacing:.06em;color:#7C5F68}
.topTitle b{font-weight:600;color:#5E434C}
.topDate{margin-left:auto;text-align:right}
.topDateNum{font-size:17px;font-weight:600;color:#7A4E5C;letter-spacing:.02em;line-height:1}
.topDateSub{font-size:9.5px;color:var(--muted);letter-spacing:.1em;margin-top:3px}

.emptyWrap{min-height:62vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.emptyCard{background:rgba(255,255,255,.7);border-radius:var(--r);padding:22px 26px;text-align:center;
  box-shadow:var(--shadow);color:#BFA3AC;font-size:12.5px;letter-spacing:.08em;line-height:2}
.emptyCard span{display:block;color:#8C6C77;font-size:13.5px;letter-spacing:.04em;margin-bottom:6px}

.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.cardHead{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.cardIco{width:28px;height:28px;border-radius:9px;background:#FFF2EF;display:flex;align-items:center;justify-content:center;flex:none}
.cardIco svg{width:15px;height:15px;stroke:#C8889A;stroke-width:1.7;fill:none}
.cardTitle{font-size:14px;font-weight:600;letter-spacing:.02em;flex:1}
.cardHint{font-size:10.5px;color:var(--muted);white-space:nowrap}
.cardText{font-size:12.5px;line-height:1.9;color:#6E5B62}

.hero{background:linear-gradient(135deg,#F2A9BE 0%,#F8C7D2 55%,#FBDDE4 100%);
  border-radius:20px;padding:17px 17px 15px;margin-bottom:13px;color:#fff;
  box-shadow:0 10px 24px rgba(220,140,160,.26);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-40px;width:110px;height:110px;border-radius:50%;
  background:rgba(255,255,255,.18)}
.heroRow{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
.heroTitle{font-size:14.5px;font-weight:600;letter-spacing:.04em}
.heroDate{font-size:10.5px;opacity:.85;letter-spacing:.06em}
.barTrack{height:6px;border-radius:6px;background:rgba(255,255,255,.35);margin:14px 0 9px;overflow:hidden;position:relative;z-index:1}
.barFill{height:100%;width:0%;border-radius:6px;background:#fff;transition:width .3s ease}
.heroFoot{display:flex;justify-content:space-between;font-size:11px;opacity:.95;position:relative;z-index:1}
.heroFoot b{font-weight:600}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:0;font-family:inherit;cursor:pointer;background:var(--chip);color:var(--chipTxt);
  font-size:12px;padding:8px 13px;border-radius:999px;transition:.16s;line-height:1.2}
.chip:active{transform:scale(.97)}
.chip.on{background:linear-gradient(135deg,#F3AFC2,#E5839B);color:#fff;font-weight:500;box-shadow:0 4px 10px rgba(220,130,150,.22)}
.chip.ghost{background:#fff;border:1px solid var(--line);color:#8C7379}
.chip.sage{background:var(--sageBg);color:#617454}
.chip.sage.on{background:#9BB08D;color:#fff;box-shadow:0 4px 10px rgba(140,160,120,.2)}
.chip.plain{background:#F7F1EE;color:#8B757C;cursor:default}
.chip.mini{font-size:10.5px;padding:5px 10px}
.chip.copy{background:#4A3A3F;color:#fff;cursor:pointer}
.chip.copy.done{background:#8FA383}

.item{display:flex;align-items:flex-start;gap:11px;padding:12px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.item:last-child{border-bottom:0;padding-bottom:2px}
.item:first-child{padding-top:2px}
.dot{width:20px;height:20px;border-radius:50%;border:1.5px solid #EFCEDA;background:#fff;flex:none;margin-top:2px;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;transition:.16s}
.item.on .dot{background:#9BB08D;border-color:#9BB08D}
.itemBody{flex:1}
.itemLabel{font-size:13px;line-height:1.55;color:#4A3A3F;transition:.16s}
.itemMeta{font-size:10.5px;color:var(--muted);margin-top:3px;letter-spacing:.02em}
.item.on .itemLabel{color:#A79A9F;text-decoration:line-through}
.itemTag{font-size:10px;padding:4px 9px;border-radius:999px;background:#F7F1EE;color:#8B757C;white-space:nowrap;flex:none;margin-top:1px}
.item.on .itemTag{background:var(--sageBg);color:#617454}

.subHead{display:flex;align-items:center;gap:8px;margin:18px 2px 10px;font-size:11px;letter-spacing:.12em;color:#9B7F89}
.subHead::after{content:"";flex:1;height:1px;background:rgba(230,200,208,.7)}

.tCard{background:#fff;border-radius:16px;padding:14px 15px;margin-bottom:10px;box-shadow:var(--shadow)}
.tTop{display:flex;gap:9px;align-items:flex-start}
.tNo{font-size:13px;font-weight:600;color:#E390A8;flex:none;margin-top:1px;min-width:18px}
.tTitle{font-size:13.5px;font-weight:600;line-height:1.55;flex:1}
.tWhy{font-size:11.5px;color:var(--muted);line-height:1.7;margin:7px 0 10px}
.tPick{margin-top:10px}

details.dCard{background:#fff;border-radius:16px;margin-bottom:9px;box-shadow:var(--shadow);overflow:hidden}
details.dCard summary{list-style:none;cursor:pointer;padding:13px 15px;display:flex;gap:9px;align-items:center}
details.dCard summary::-webkit-details-marker{display:none}
details.dCard .idx{font-size:12px;color:#E390A8;font-weight:600;flex:none}
details.dCard .ttl{font-size:12.5px;font-weight:600;line-height:1.5;flex:1}
details.dCard .miniTag{font-size:10px;background:var(--chip);color:#8E6570;padding:4px 8px;border-radius:999px;white-space:nowrap}
details.dCard[open] summary{border-bottom:1px solid var(--line)}
.dBody{padding:10px 15px 14px;font-size:12px;line-height:1.85;color:#5F4E55}
.dRow{margin:4px 0}
.dK{color:#C4627E;font-size:10.5px;letter-spacing:.06em;margin-right:5px}
.refLink{display:block;font-size:10px;line-height:1.5;color:#B09AA1;font-weight:400;margin-top:4px;word-break:break-all}
.refLink a{color:#C4627E;text-decoration:none}
.trendCard{background:#fff;border-radius:16px;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
.trendLinkRow{display:flex;align-items:center;gap:8px;padding:12px 12px 0}
.trendUrl{flex:1;font-size:11px;line-height:1.6;color:var(--muted);word-break:break-all}
.trendUrl a{color:var(--accentDeep);text-decoration:none}
.trendPreview{position:relative;margin:12px;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:#FFF8F6;border:1px solid var(--line)}
.trendPreview.isEmpty{aspect-ratio:16/9}
.trendPreview iframe{display:block;width:100%;height:100%;border:0;background:#fff}
.previewEmpty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;background:#FFF8F6;color:var(--muted);font-size:11px;line-height:1.8;pointer-events:none}
.previewNote{margin:-7px 13px 10px;text-align:right;font-size:9.5px;color:var(--muted)}
.trendHeat{margin:0 12px 12px;padding:10px 12px;background:#FFF8F6;border-radius:12px;font-size:11.5px;line-height:1.7;color:#6E5B62}
.trendLogic{padding:0 14px 14px}
.trendTitle{font-size:13.5px;font-weight:600;line-height:1.55;margin-bottom:7px}
.trendLogicText{font-size:12px;line-height:1.85;color:#5F4E55;white-space:normal}

pre.doc{background:#FFF8F6;border-radius:12px;padding:12px;font-size:12px;line-height:1.85;color:#5A474E;
  white-space:pre-wrap;word-break:break-word;margin:9px 0 0;font-family:inherit}
.tl{list-style:none;margin:8px 0 0;padding:0}
.tl li{display:flex;gap:9px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12px;line-height:1.7;color:#5A474E}
.tl li:last-child{border-bottom:0}
.tl .tm{flex:none;width:48px;color:#D07A93;font-size:10.5px;padding-top:2px}

.metric{display:flex;gap:8px;margin-bottom:12px}
.mCell{flex:1;background:#fff;border-radius:14px;padding:12px 11px;box-shadow:var(--shadow)}
.mL{font-size:10px;color:var(--muted);letter-spacing:.05em}
.mV{font-size:17px;font-weight:600;color:#C4627E;margin-top:5px}
.mV.dim{font-size:14px;font-weight:500;color:#B9A7AD}

.poolRow{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line)}
.poolRow:last-child{border-bottom:0}
.poolName{font-size:13px;font-weight:500;line-height:1.5;flex:1}
.poolForm{font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.6}

.noteBar{background:rgba(255,255,255,.72);border-radius:14px;padding:11px 14px;font-size:11px;
  line-height:1.7;color:#957E86;margin-bottom:12px;box-shadow:0 3px 10px rgba(190,150,160,.07)}
.feedBox{width:100%;min-height:104px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  font-family:inherit;font-size:12px;line-height:1.8;color:#5F4E55;background:#FFFCFB;resize:vertical;outline:none}
.feedBox:focus{border-color:#EFC3D1;box-shadow:0 0 0 3px rgba(238,157,177,.12)}
.feedTip{font-size:10.5px;color:var(--muted);margin-top:8px;letter-spacing:.02em}

.cfgRow{margin-bottom:8px}
.cfgRow label{display:block;font-size:10.5px;color:var(--muted);margin-bottom:4px;letter-spacing:.06em}
.cfgInput{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-family:inherit;
  font-size:12px;background:#FFFCFB;outline:none;color:#5F4E55}
.cfgInput:focus{border-color:#EFC3D1}
.chatLog{display:flex;flex-direction:column;gap:9px;margin:4px 0 10px}
.msg{max-width:84%;padding:10px 13px;border-radius:15px;font-size:12.5px;line-height:1.85;
  white-space:pre-wrap;word-break:break-word;box-shadow:var(--shadow)}
.msg.me{margin-left:auto;background:linear-gradient(135deg,#F3AFC2,#E5839B);color:#fff;box-shadow:0 5px 13px rgba(220,130,150,.2)}
.msg.ai{background:#fff;color:#5F4E55}
.msg.tip{background:#FFF6F4;color:#A2808A;font-size:11px;box-shadow:none;max-width:100%}
.chatBar{display:flex;gap:8px;align-items:flex-end;flex-wrap:nowrap}
#netlify-badge,#nl-badge-frame,[id*="netlify-badge"],[id*="badge"],iframe[src*="netlify.com/badge"]{display:none!important;visibility:hidden!important;pointer-events:none!important}
#chatMic{flex:none;min-width:56px;padding:12px 10px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);
  max-width:88vw;background:rgba(74,58,63,.95);color:#fff;font-size:12.5px;line-height:1.7;padding:11px 15px;border-radius:14px;
  opacity:0;pointer-events:none;transition:.22s;z-index:120;box-shadow:0 8px 20px rgba(0,0,0,.18);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#chatSend{flex:none;min-width:62px;padding:12px 12px}
.chatInput{flex:1;min-height:46px;max-height:130px;border:1px solid var(--line);border-radius:14px;
  padding:11px 13px;font-family:inherit;font-size:12.5px;line-height:1.7;background:#fff;outline:none;resize:none;color:#4A3A3F}
.chatInput:focus{border-color:#EFC3D1;box-shadow:0 0 0 3px rgba(238,157,177,.12)}

@media (min-width:700px){
  .rail{width:118px;padding-left:12px;padding-right:12px}
  .sheet{margin-left:118px;padding:22px 26px 70px}
  .navItem .lbl{font-size:11px}
}
</style>
</head>
<body>
<div id="app">
  <aside class="rail" id="rail">
    <div class="brand"><div class="brandMark">兰</div><div class="brandTxt">小红书工作台</div></div>
    <button class="navItem" data-key="overview"><span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 11h18"/><path d="M8 15h3"/></svg></span><span class="lbl">概况</span></button>
    <button class="navItem" data-key="todos"><span class="ico"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/></svg></span><span class="lbl">待办</span></button>
    <button class="navItem" data-key="topics"><span class="ico"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3 11c.5 1 1 2 1 3h4c0-1 .5-2 1-3A6 6 0 0 0 12 3z"/></svg></span><span class="lbl">选题</span></button>
    <button class="navItem" data-key="teardown"><span class="ico"><svg viewBox="0 0 24 24"><path d="M12 3l8 4-8 4-8-4 8-4z"/><path d="M4 12l8 4 8-4"/><path d="M4 17l8 4 8-4"/></svg></span><span class="lbl">灵感</span></button>
    <button class="navItem" data-key="content"><span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M8 6l2-3M16 6l-2-3"/><path d="M11 14l4 2-4 2z"/></svg></span><span class="lbl">产出</span></button>
    <button class="navItem" data-key="pool"><span class="ico"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></span><span class="lbl">赛马</span></button>
    <button class="navItem" data-key="review"><span class="ico"><svg viewBox="0 0 24 24"><path d="M4 19h16"/><path d="M7 16v-5M12 16v-8M17 16v-3"/><path d="M15 5l4 2"/></svg></span><span class="lbl">复盘</span></button>
    <button class="navItem" data-key="chat"><span class="ico"><svg viewBox="0 0 24 24"><path d="M4 6h16v10H9l-5 4V6z"/><path d="M8 10h8M8 13h5"/></svg></span><span class="lbl">对话</span></button>
  </aside>

  <main class="sheet">
    <div class="topBar">
      <div class="topMark">‹</div>
      <div class="topTitle"><b data-acc-title>兰叙孕中期</b> · 小红书工作台</div>
      <div class="topDate"><div class="topDateNum" data-d1></div><div class="topDateSub" data-d2></div></div>
    </div>
    <div class="accSwitch">
      <button class="accBtn" data-acc="sale"><b>兰叙孕中期</b><small>带货号 · 自用实测</small></button>
      <button class="accBtn" data-acc="ip"><b>清醒Amanda</b><small>IP号 · 孕期日常</small></button>
    </div>
    <section id="panel">
      <div class="emptyWrap"><div class="emptyCard"><span>从左侧选一个模块</span>点哪一项，右边才加载哪一项</div></div>
    </section>
  </main>
</div>

<script>
var COPY = {};
COPY.cover = "主标：孕中期刷牙想吐，先别硬扛\n副标：味道、泡沫、适合谁一次说清\n角标：二胎孕妈·自用大半个月·不吹不黑";
COPY.body = "孕中期开始，我刷牙经常刷到一半就想呕，牙龈一碰就出点血。\n\n如果你也怕薄荷味冲、泡沫多，这篇把我换牙膏时看的 3 个点和不适合谁一次说清，别只看“孕妇专用”四个字。\n\n换牙膏之前我踩过两个坑：一个是薄荷味太冲，一入口更想吐；一个是泡沫太多，含着就难受。\n\n现在这管我用了大半个月。我留下它，不是因为包装上写了什么，而是下面三个每天都能自己感受到的细节：\n1. 味道淡，早上起来刷不会反胃\n2. 泡沫细，不用含很久\n3. 刷完口气清爽，一整天没那么闷\n\n缺点也说：它不是一刷就立刻不一样的那种，属于日常用着安稳的类型；喜欢强薄荷感的姐妹可能会觉得不够劲儿。\n\n在我这里选的理由，不是多一个商品链接，而是我把味道、泡沫、真实使用感、缺点和适合谁都先拆开，帮你先判断会不会买错，而不是只说“好用”。\n\n适合：孕中期刷牙想吐、牙龈容易敏感、怕强薄荷的孕妈。\n不适合：喜欢强薄荷感，或期待立刻改变口腔问题的人。\n\n如果你和我的情况接近，可以先在商品卡核对成分和规格，符合自己的需要再选。每个人体质不一样，我用着舒服，不代表人人一样；牙龈持续出血或不适，先咨询医生。";
COPY.tags = "#孕期口腔护理 #孕妇牙膏 #孕中期 #孕期好物 #孕妈日常 #孕期避坑 #牙龈敏感 #二胎孕妈";
COPY.script = "0-3s｜侧躺床上，手按胸口｜孕中期一翻身，胸先疼醒的，先别硬扛。\n3-7s｜坐起来披外套｜弹力、承托、缺点一次说清，免得你买错。\n7-15s｜站立、抬手、弯腰三个动作｜先看肩带和下围。我穿了快一个月，抬手不往上跑，坐着也不勒。\n15-23s｜手拉下围，弹力特写｜再看弹力。下围能拉到这里，胸围有变化，也不用硬挤。\n23-30s｜杯型特写，正面讲缺点｜杯型也别跳过。没有钢圈，杯型偏软；想要强承托的，先看清楚这点。\n30-39s｜抱大宝、坐工位、侧躺场景切换｜在我这里选的理由，不是一句“好用”，而是真实上身、缺点和尺码边界都给你看，先帮你判断合不合适。\n39-45s｜侧面坐姿，展示尺码参考｜怕钢圈、胀痛的，先对照商品卡的尺码和面料；胸大的先量下围，再决定。";

var panel = document.getElementById('panel');
var rail = document.getElementById('rail');
var speaking = false;

var K_TODO='amanda_todo_261111', K_RISK='amanda_risk_261111', K_SEL='amanda_sel_261111', K_PICK='amanda_pick_261111', K_FEED='amanda_feed_261111';
var K_CFG='amanda_chatcfg_261111', K_MSG='amanda_chatmsg_261111';
var K_ACC='amanda_acc_261111';
var ACC=read(K_ACC,'sale');
function kAcc(base){ return ACC==='ip' ? base+'_ip' : base; }
function read(k,def){ try{ var v=JSON.parse(localStorage.getItem(k)); return v===null?def:v; }catch(e){ return def; } }
function write(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

function stopSpeak(){
  if('speechSynthesis' in window){ window.speechSynthesis.cancel(); }
  speaking=false; var b=panel.querySelector('.ttsBtn'); if(b){b.classList.remove('on');b.textContent='朗读';}
}
function speakText(t){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(t); u.lang='zh-CN'; u.rate=0.95;
  u.onend=function(){speaking=false;var b=panel.querySelector('.ttsBtn');if(b){b.classList.remove('on');b.textContent='朗读';}};
  window.speechSynthesis.speak(u);
}

function render(key){
  stopSpeak();
  var m=(ACC==='ip'&&MODULES_IP[key])?MODULES_IP[key]:(MODULES[key]||MODULES_IP[key]);
  if(!m) return;
  panel.innerHTML='<div class="card" style="padding:0;background:transparent;box-shadow:none;margin:0 0 12px"><div class="cardHead" style="margin:0;padding:0 3px"><span class="cardTitle" style="font-size:17px;letter-spacing:.04em">'+m.label+'</span><button class="chip ghost ttsBtn">朗读</button></div></div>'+m.html;
  Array.prototype.forEach.call(rail.querySelectorAll('.navItem'),function(b){ b.classList.toggle('active', b.getAttribute('data-key')===key); });
  window.scrollTo(0,0);
  if(typeof fillDates==='function') fillDates();

  var tts=panel.querySelector('.ttsBtn');
  if(tts){ tts.addEventListener('click',function(){
    if(speaking){ stopSpeak(); return; }
    speaking=true; tts.classList.add('on'); tts.textContent='停止';
    speakText(panel.innerText.replace(/\n+/g,'。').replace(/朗读|复制|已复制/g,'').replace(/。+/g,'。').slice(0,6000));
  }); }

  Array.prototype.forEach.call(panel.querySelectorAll('.chip.copy'),function(btn){
    btn.addEventListener('click',function(){ copyText(btn.getAttribute('data-copy-text')||COPY[btn.getAttribute('data-copy')]||'',btn); });
  });

  bindChips(); bindChecks(); bindPick(); bindFeed(); bindChat();
}

function chatSystem(){
  var ip = ACC==='ip';
  return '你是 Amanda 的小红书运营助手，只回答小红书运营相关的事。'+
    (ip
      ? '当前账号：IP号「清醒Amanda｜孕期日常」，孕21周二胎妈妈，孕中期分开，独自带8岁女儿。人设是记录每天在干嘛、吃什么、怎么过。'+
        '内容以图文为主（8成图文2成视频，只有需要动作演示才拍视频）。不带货、不挂商品、不挂链接，变现只接品牌广告，广告必须蒲公英报备。'+
        '不卖惨、不控诉具体的人、不涉医疗判断。'
      : '当前账号：带货号「兰叙孕中期」，孕产与儿童好物实测，零情感零故事。'+
        '每条必须回答「用户为什么要在我这里买」：真实自用、筛选标准、实测细节、优缺点、适合与不适合谁。商业笔记必须蒲公英报备。')+
    '回答规则：先抛痛点再给结论；给可直接用的文案、结构或清单，不写空话；数据不全就说不知道，不编造热度、价格、销量或平台规则。'+
    '回复用中文，简洁，能用短句就不用长句。';
}

function bindChat(){
  var log=panel.querySelector('#chatLog');
  if(!log) return;
  var cfg=read(K_CFG,{base:'',model:'',key:''});
  var baseEl=panel.querySelector('#cfgBase'), modelEl=panel.querySelector('#cfgModel'), keyEl=panel.querySelector('#cfgKey');
  if(cfg.base) baseEl.value=cfg.base;
  if(cfg.model) modelEl.value=cfg.model;
  if(keyEl) keyEl.value=cfg.key||'';
  var tip=panel.querySelector('#cfgTip');
  var say=function(t){ if(tip) tip.textContent=t; };
  if(keyEl) keyEl.addEventListener('input',function(){
    var n=(keyEl.value||'').replace(/\s/g,'').length;
    if(n) say('Key 已填入 '+n+' 位（DeepSeek 的 Key 通常是 35 位左右）。点保存，再点测试连接。');
  });

  function draw(){
    var msgs=read(K_MSG,[]);
    log.innerHTML='';
    if(!msgs.length){
      var h=document.createElement('div'); h.className='msg tip';
      h.textContent='还没有对话。可以先问：今天发什么 / 帮我改写这条笔记 / 这条链接怎么拆。';
      log.appendChild(h);
    }
    msgs.forEach(function(m){
      var d=document.createElement('div');
      d.className='msg '+(m.role==='user'?'me':'ai');
      d.textContent=m.content;
      log.appendChild(d);
    });
    window.scrollTo(0,document.body.scrollHeight);
  }
  draw();

  var save=panel.querySelector('#cfgSave');
  if(save) save.addEventListener('click',function(){
    var c={base:(baseEl.value||'').trim(),model:(modelEl.value||'').trim(),key:(keyEl.value||'').trim()};
    write(K_CFG,c);
    say(c.base&&c.model?'已保存，可以直接在下面聊。':'接口地址和模型名没填完，这两项必须有。');
  });
  var clr=panel.querySelector('#cfgClear');
  if(clr) clr.addEventListener('click',function(){ write(K_MSG,[]); draw(); say('对话已清空。'); });

  var tst=panel.querySelector('#cfgTest');
  if(tst) tst.addEventListener('click',function(){
    var b=(baseEl.value||'').trim(), mo=(modelEl.value||'').trim(), k=(keyEl.value||'').trim();
    if(!b||!mo){ say('接口地址和模型名要先填。'); return; }
    say('正在连接…');
    askModel({base_url:b,model:mo,api_key:k,messages:[{role:'user',content:'只回复两个字：正常'}]},
             [{role:'user',content:'只回复两个字：正常'}])
      .then(function(txt){ write(K_CFG,{base:b,model:mo,key:k}); say('连接成功，模型回：'+String(txt).slice(0,40)); })
      .catch(function(e){ say('连接失败：'+(e&&e.message?e.message:'未知错误')); });
  });

  var input=panel.querySelector('#chatInput'), sendBtn=panel.querySelector('#chatSend');
  var busy=false;

  function directCall(b,mo,k,msgs){
    if(!k) return Promise.reject(new Error('还没填 Key，先在上面填 DeepSeek 的 Key 再点保存。'));
    return fetch(b,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},
      body:JSON.stringify({model:mo,messages:[{role:'system',content:chatSystem()}].concat(msgs||[]),temperature:0.6,stream:false})})
      .then(function(r){ return r.text().then(function(t){
        var j=null; try{ j=JSON.parse(t); }catch(e){}
        if(!r.ok) throw new Error((j&&j.error&&j.error.message)||('接口返回 '+r.status));
        if(!j||!j.choices||!j.choices[0]) throw new Error('接口没有返回内容');
        return j.choices[0].message.content;
      });});
  }
  function askModel(payload,msgs){
    return fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
      .then(function(r){ return r.text().then(function(t){
        var j=null; try{ j=JSON.parse(t); }catch(e){}
        if(r.ok&&j&&j.content) return j.content;
        if(r.ok&&j&&j.error) throw new Error(j.error);
        return directCall(payload.base_url,payload.model,payload.api_key,msgs);
      });})
      .catch(function(e){
        if(e&&e.message&&e.message!=='Failed to fetch') throw e;
        return directCall(payload.base_url,payload.model,payload.api_key,msgs);
      });
  }
  function withTimeout(p,ms){
    return new Promise(function(res,rej){
      var t=setTimeout(function(){ rej(new Error('等了 '+Math.round(ms/1000)+' 秒没回应，检查手机网络再点一次')); },ms);
      p.then(function(v){ clearTimeout(t); res(v); },function(e){ clearTimeout(t); rej(e); });
    });
  }
  function send(){
    if(busy) return;
    var text=(input.value||'').trim(); if(!text) return;
    var c=read(K_CFG,{base:'',model:'',key:''});
    var bEl=panel.querySelector('#cfgBase'), mEl=panel.querySelector('#cfgModel'), kEl=panel.querySelector('#cfgKey');
    if(!c.base) c.base=(bEl&&bEl.value?bEl.value.trim():'')||'https://api.deepseek.com/v1/chat/completions';
    if(!c.model) c.model=(mEl&&mEl.value?mEl.value.trim():'')||'deepseek-chat';
    if(!c.key) c.key=(kEl&&kEl.value?kEl.value.trim():'');
    if(!c.base||!c.model){ say('接口地址和模型名没读到，刷新页面再试。'); return; }
    if(!c.key){ toast('还没填 Key：点上面「API Key」框粘贴，再点保存'); if(kEl) kEl.focus(); return; }
    write(K_CFG,c);
    var msgs=read(K_MSG,[]);
    msgs.push({role:'user',content:text});
    write(K_MSG,msgs); input.value=''; draw();
    busy=true; sendBtn.textContent='发送中';
    var payload={base_url:c.base,model:c.model,api_key:c.key,
      messages:[{role:'system',content:chatSystem()}].concat(msgs.slice(-12))};
    withTimeout(askModel(payload, msgs.slice(-12)), 60000)
      .then(function(out){
        var m=read(K_MSG,[]); m.push({role:'assistant',content:String(out)}); write(K_MSG,m);
      })
      .catch(function(e){
        var m=read(K_MSG,[]);
        m.push({role:'assistant',content:'发送失败：'+(e&&e.message?e.message:'未知错误')+'\n（检查 Key 是否正确、账户是否有余额）'});
        write(K_MSG,m);
      })
      .then(function(){ busy=false; sendBtn.textContent='发送'; draw(); });
  }
  if(sendBtn) sendBtn.addEventListener('click',send);
  if(input) input.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); send(); }
  });

  var mic=panel.querySelector('#chatMic');
  if(mic) mic.addEventListener('click',function(){
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){ input.focus(); toast('这个浏览器不给网页用麦克风。点键盘右下角 🎤 说话，字会自己进来'); return; }
    if(!window.isSecureContext){ input.focus(); toast('语音只能在 https 网址下用，请用 amanda-xhs2026.netlify.app 打开'); return; }
    var rec=new SR(); rec.lang='zh-CN'; rec.interimResults=true; rec.continuous=false;
    var startVal=(input.value||'')+(input.value?' ':'');
    rec.onstart=function(){ mic.classList.add('on'); mic.textContent='听…'; };
    rec.onresult=function(e){
      var t='';
      for(var i=e.resultIndex;i<e.results.length;i++) t+=e.results[i][0].transcript;
      input.value=startVal+t;
    };
    rec.onerror=function(ev){
      mic.classList.remove('on'); mic.textContent='语音';
      if(ev&&ev.error==='not-allowed') toast('麦克风被拦了：设置 → Safari → 麦克风，允许访问后再点');
      else toast('没听清，再说一次试试');
    };
    rec.onend=function(){ mic.classList.remove('on'); mic.textContent='语音'; input.focus(); };
    rec.start();
  });
}

function bindFeed(){
  var box=panel.querySelector('#feedBox'), tip=panel.querySelector('#feedTip');
  if(!box) return;
  box.value=read(K_FEED,'');
  var say=function(t){ if(tip) tip.textContent=t; };
  var s=panel.querySelector('#feedSave');
  if(s) s.addEventListener('click',function(){ write(K_FEED,box.value); say('已存到这台设备，下次打开还在。'); });
  var g=panel.querySelector('#feedGo');
  if(g) g.addEventListener('click',function(){
    if(!box.value.trim()){ say('箱子里还是空的，先粘一条链接进来。'); return; }
    copyText('帮我拆解这箱对标笔记，按链接 → 热度 → 拆解顺序给：\n\n'+box.value, g);
    say('已复制。把它贴到我们的聊天里发我，我马上拆。');
  });
  var c=panel.querySelector('#feedClear');
  if(c) c.addEventListener('click',function(){ box.value=''; write(K_FEED,''); say('已清空。'); });
  box.addEventListener('input',function(){ write(K_FEED,box.value); });
}

function copyText(t,btn){
  var ok=function(){ btn.classList.add('done'); btn.textContent='已复制'; setTimeout(function(){btn.classList.remove('done');btn.textContent=btn.getAttribute('orig')||'复制';},1500); };
  if(!btn.getAttribute('orig')){ btn.setAttribute('orig',btn.textContent); }
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(ok).catch(function(){fb(t,ok);}); }
  else { fb(t,ok); }
}
function fb(t,ok){ var ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); ok(); }

function bindChips(){
  var sel=read(kAcc(K_SEL),{});
  Array.prototype.forEach.call(panel.querySelectorAll('[data-group]'),function(el){
    if(el.tagName==='BUTTON') return;
    var g=el.getAttribute('data-group');
    Array.prototype.forEach.call(el.querySelectorAll('.chip'),function(c){
      if(sel[g]===c.getAttribute('data-val')) c.classList.add('on');
      c.addEventListener('click',function(){
        var s=read(kAcc(K_SEL),{}); s[g]=c.getAttribute('data-val'); write(kAcc(K_SEL),s); render(currentKey);
      });
    });
  });
}

var currentKey=null;

function bindChecks(){
  var todo=read(kAcc(K_TODO),[]);
  Array.prototype.forEach.call(panel.querySelectorAll('.item[data-id]'),function(it){
    if(todo.indexOf(it.getAttribute('data-id'))>-1) it.classList.add('on');
    it.addEventListener('click',function(){
      var d=read(kAcc(K_TODO),[]); var id=it.getAttribute('data-id'); var i=d.indexOf(id);
      if(i>-1){d.splice(i,1);it.classList.remove('on');}else{d.push(id);it.classList.add('on');}
      write(kAcc(K_TODO),d); syncCounts();
    });
  });
  var risk=read(kAcc(K_RISK),[]);
  Array.prototype.forEach.call(panel.querySelectorAll('.item[data-risk-id]'),function(it){
    if(risk.indexOf(it.getAttribute('data-risk-id'))>-1) it.classList.add('on');
    it.addEventListener('click',function(){
      var d=read(kAcc(K_RISK),[]); var id=it.getAttribute('data-risk-id'); var i=d.indexOf(id);
      if(i>-1){d.splice(i,1);it.classList.remove('on');}else{d.push(id);it.classList.add('on');}
      write(kAcc(K_RISK),d); syncCounts();
    });
  });
  syncCounts();
}

function bindPick(){
  var pick=read(kAcc(K_PICK),null);
  Array.prototype.forEach.call(panel.querySelectorAll('[data-pick]'),function(b){
    if(pick===b.getAttribute('data-pick')){ b.classList.add('on'); b.textContent='已圈选'; }
    b.addEventListener('click',function(){
      var cur=read(kAcc(K_PICK),null); var id=b.getAttribute('data-pick');
      write(kAcc(K_PICK), cur===id?null:id);
      render(currentKey);
    });
  });
}

function syncCounts(){
  var t=read(kAcc(K_TODO),[]).length, r=read(kAcc(K_RISK),[]).length;
  Array.prototype.forEach.call(panel.querySelectorAll('[data-done]'),function(el){ el.textContent=t; });
  Array.prototype.forEach.call(panel.querySelectorAll('[data-risk]'),function(el){ el.textContent=r; });
  Array.prototype.forEach.call(panel.querySelectorAll('[data-bar]'),function(el){ el.style.width=Math.round(t/7*100)+'%'; });
}

Array.prototype.forEach.call(rail.querySelectorAll('.navItem'),function(b){
  b.addEventListener('click',function(){ currentKey=b.getAttribute('data-key'); render(currentKey); });
});

function setAcc(a,isInit){
  ACC=(a==='ip')?'ip':'sale'; write(K_ACC,ACC);
  Array.prototype.forEach.call(document.querySelectorAll('.accBtn'),function(b){
    b.classList.toggle('on', b.getAttribute('data-acc')===ACC);
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-acc-title]'),function(el){
    el.textContent = ACC==='ip' ? '清醒Amanda' : '兰叙孕中期';
  });
  if(isInit) return;
  if(!currentKey){ currentKey='overview'; }
  render(currentKey);
}
Array.prototype.forEach.call(document.querySelectorAll('.accBtn'),function(b){
  b.addEventListener('click',function(){ setAcc(b.getAttribute('data-acc')); });
});
setAcc(ACC,true);
fillDates();
setInterval(fillDates,60000);


/* 日期跟随设备，不写死 */
function fillDates(){
  var n=new Date();
  var w=['周日','周一','周二','周三','周四','周五','周六'][n.getDay()];
  var mm=('0'+(n.getMonth()+1)).slice(-2), dd=('0'+n.getDate()).slice(-2);
  var full=n.getFullYear()+'.'+mm+'.'+dd;
  Array.prototype.forEach.call(document.querySelectorAll('[data-d1]'),function(e){ e.textContent=mm+'.'+dd; });
  Array.prototype.forEach.call(document.querySelectorAll('[data-d2]'),function(e){ e.textContent=w; });
  Array.prototype.forEach.call(document.querySelectorAll('[data-d3]'),function(e){ e.textContent=full; });
}

/* 全局提示条：手机上看得到的黑底提示 */
var _toastT=null;
function toast(t){
  var el=document.getElementById('toast');
  if(!el){ el=document.createElement('div'); el.id='toast'; document.body.appendChild(el); }
  el.textContent=t; el.classList.add('show');
  clearTimeout(_toastT);
  _toastT=setTimeout(function(){ el.classList.remove('show'); },3600);
}

(function(){
  function killBadge(){
    Array.prototype.forEach.call(document.querySelectorAll('#netlify-badge, #nl-badge-frame, [id*="netlify-badge"], [id*="badge"], iframe[src*="netlify.com/badge"]'),function(el){
      if(el&&el.parentNode) el.parentNode.removeChild(el);
    });
  }
  killBadge();
  try{ new MutationObserver(killBadge).observe(document.body,{childList:true,subtree:true}); }catch(e){}
})();
